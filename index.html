<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGTG Events by Roastbeast</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Rubik:wght@400;500;600;700;800&display=swap');

  :root{
    --ink-black:#0a0c14;
    --panel:#121a33;
    --panel-2:#1b2547;
    --line:#2c3866;
    --yellow:#ffc400;
    --yellow-soft:rgba(255,196,0,0.16);
    --blue:#3b72f2;
    --blue-soft:rgba(59,114,242,0.18);
    --paper:#f4f0de;
    --muted:#8891ba;
    --muted-2:#5c6690;
    --danger:#e2543f;
    --cat-events:#ff9a3d;
    --cat-hero:#a463f2;
    --cat-optimize:#2ec4b6;
    --cat-faction:#ff4fa3;
    --cat-food:#7ed957;
    --cat-nightmares:#d1293d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink-black);color:var(--paper);font-family:'Rubik',system-ui,sans-serif;}
  body{
    padding-bottom:120px;
    background-image:
      radial-gradient(var(--panel) 1px, transparent 1px);
    background-size:14px 14px;
    background-position:-7px -7px;
  }

  /* ---------- Lock / editor toggle ---------- */
  .toolbar{
    position:absolute; top:22px; right:24px; z-index:31;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:min(90vw, 420px);
  }
  .lock-btn{
    background:var(--panel); border:2px solid var(--blue); color:var(--blue);
    font-family:'Rubik',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.5px;
    padding:7px 14px; border-radius:20px; cursor:pointer;
    box-shadow:3px 3px 0 var(--ink-black), 3px 3px 0 1px var(--blue);
  }
  .lock-btn:hover{ filter:brightness(1.15); }
  .lock-btn.unlocked{ background:var(--yellow); border-color:#0a0c14; color:#181200;
    box-shadow:3px 3px 0 var(--ink-black), 3px 3px 0 1px #0a0c14; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg, var(--ink-black) 75%, rgba(10,12,20,0));
    padding:28px 24px 18px;
    display:flex; flex-direction:column; gap:4px;
    border-bottom:3px solid var(--panel);
  }
  .topbar h1{
    font-family:'Anton', sans-serif;
    font-size:44px;
    letter-spacing:1.5px;
    margin:0;
    line-height:1;
    color:var(--yellow);
    -webkit-text-stroke:1px #05060a;
  }
  .topbar h1 span{color:var(--blue); -webkit-text-stroke:1.5px #05060a;}
  .subtitle{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:500;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:2px;
  }
  .stats{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.5px;
    display:none;
  }
  .stats b{color:var(--yellow);}

  /* ---------- Search ---------- */
  .search-wrap{ position:relative; margin-top:14px; max-width:360px; }
  .search-wrap input{
    width:100%; background:var(--panel); border:2px solid var(--line); color:var(--paper);
    border-radius:20px; padding:9px 16px 9px 34px; font-family:'Rubik',sans-serif; font-size:13px;
  }
  .search-wrap input::placeholder{ color:var(--muted-2); }
  .search-wrap input:focus{ outline:none; border-color:var(--yellow); }
  .search-icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color:var(--muted); pointer-events:none;
  }
  .search-icon svg{ width:100%; height:100%; }
  .search-clear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; display:none;
  }
  .search-wrap.has-query .search-clear{ display:block; }
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel); border:2px solid var(--line); border-radius:6px;
    max-height:280px; overflow-y:auto; z-index:40; display:none;
    box-shadow:4px 4px 0 rgba(0,0,0,0.5);
  }
  .search-wrap.has-query .search-results{ display:block; }
  .search-result{
    padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
  }
  .search-result:last-child{ border-bottom:none; }
  .search-result:hover{ background:var(--blue-soft); }
  .search-result .sr-title{ font-size:13px; color:var(--paper); font-weight:600; }
  .search-result .sr-date{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); }
  .search-empty{ padding:14px; font-size:12px; color:var(--muted); text-align:center; }

  .daynum-cell.dimmed{ opacity:0.25; }
  .daynum-cell.match{ box-shadow:0 0 0 2px var(--blue), 0 0 8px var(--blue-soft); z-index:1; position:relative; }

  /* ---------- Layout ---------- */
  .wrap{max-width:1040px; margin:0 auto; padding:0 20px;}

  /* ---------- Year rail (quick nav) ---------- */
  .rail{
    position:fixed; top:50%; left:12px; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:10px; z-index:25;
  }
  .rail button{
    background:var(--panel); border:2px solid var(--blue); color:var(--blue);
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; letter-spacing:1px;
    padding:6px 8px; border-radius:3px; cursor:pointer; writing-mode:vertical-rl;
    transition:all .15s ease;
  }
  .rail button:hover, .rail button.active{ color:#181200; background:var(--yellow); border-color:#0a0c14; }
  @media (max-width:900px){ .rail{display:none;} }

  /* ---------- Reel (month block) ---------- */
  .reel{
    position:relative;
    margin:52px 0 42px;
    background:var(--panel);
    border:3px solid #05060a;
    border-radius:2px;
    padding:30px 30px 26px;
    box-shadow:8px 8px 0 var(--blue);
  }
  .reel-label{
    display:flex; align-items:center; gap:14px; margin-bottom:26px;
    padding-bottom:0; border-bottom:none;
  }
  .reel-month{
    font-family:'Bangers', cursive; font-size:27px; letter-spacing:2px; color:#141000;
    background:var(--yellow);
    padding:7px 22px 7px 16px;
    position:relative;
    clip-path:polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%);
    border:2px solid #05060a;
    margin-left:-33px;
  }
  .reel-year{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:var(--paper);
    background:var(--blue); border:2px solid #05060a; border-radius:50%;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .reel-count{
    margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--muted); letter-spacing:0.5px;
  }

  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px; }
  .weekdays span{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; text-align:center;
    color:var(--muted-2); letter-spacing:1px;
  }

  .month-grid{ display:flex; flex-direction:column; }

  .week-row{ border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .week-row:last-child{ border-bottom:none; margin-bottom:0; }

  .week-daynums{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:5px; }
  .daynum-cell{
    background:none; border:none; color:var(--paper);
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:15px;
    text-align:left; padding:4px 5px; cursor:pointer; border-radius:3px;
  }
  .daynum-cell:hover{ background:var(--panel-2); }
  .daynum-cell.outside{ color:var(--muted-2); font-weight:400; }
  .daynum-cell.today{ color:var(--yellow); background:var(--yellow-soft); font-weight:800; }
  body:not(.editor-mode) .daynum-cell:not(.has-event){ cursor:default; }
  body:not(.editor-mode) .daynum-cell:not(.has-event):hover{ background:none; }

  .week-bars{
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px 8px;
  }
  .event-bar{
    border:1.5px solid #05060a; color:#0a0c14; font-weight:700;
    font-family:'Rubik',sans-serif; font-size:12px; text-align:left;
    padding:3px 8px; height:26px; line-height:20px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; border-left-width:1.5px; border-right-width:1.5px;
  }
  .event-bar:hover{ filter:brightness(1.12); }
  .event-bar:not(.bar-start){ border-left:none; margin-left:-8px; padding-left:10px; }
  .event-bar:not(.bar-end){ border-right:none; margin-right:-8px; }
  .event-bar.bar-start{ border-radius:13px 0 0 13px; }
  .event-bar.bar-end{ border-radius:0 13px 13px 0; }
  .event-bar.bar-start.bar-end{ border-radius:13px; }

  .event-card{
    position:relative;
    background:var(--panel-2); border:2px solid var(--line); border-radius:4px;
    padding:14px; margin-bottom:12px;
  }
  .event-card .cat-badge{ margin-bottom:6px; }
  .event-card h3{ font-family:'Rubik',sans-serif; font-size:15px; font-weight:700; color:var(--paper); margin:0 0 6px; }
  .event-card .note-text{ margin-bottom:10px; }
  .event-card .preview-img{ margin-bottom:10px; }
  .event-card-actions{ display:flex; gap:8px; }
  .event-card-actions .btn{ padding:7px 12px; font-size:12px; flex:none; }
  .add-event-btn{ width:100%; margin-top:4px; }

  /* ---------- Jump to today ---------- */
  .jump-today{
    position:fixed; bottom:22px; right:22px; z-index:30;
    background:var(--yellow); color:#181200; border:2px solid #05060a;
    font-family:'Rubik',sans-serif; font-weight:800; font-size:12px;
    letter-spacing:1px; padding:12px 18px; border-radius:30px;
    cursor:pointer; box-shadow:4px 4px 0 var(--blue);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .jump-today:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--blue); }
  .jump-today:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--blue); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(5,6,10,0.82);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--panel); border:3px solid #05060a; border-radius:4px;
    max-width:440px; width:100%; max-height:88vh; overflow-y:auto;
    padding:26px;
    position:relative;
    box-shadow:8px 8px 0 var(--blue);
  }
  .modal-close{
    position:absolute; top:14px; right:14px; background:none; border:none;
    color:var(--muted); font-size:22px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ color:var(--yellow); }
  .modal h2{
    font-family:'Bangers',cursive; font-size:28px; letter-spacing:1px;
    margin:0 0 4px; color:var(--yellow);
  }
  .modal .date-sub{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--blue); margin-bottom:18px; letter-spacing:0.5px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; letter-spacing:0.3px;}
  .field input[type="text"], .field input[type="date"], .field textarea{
    width:100%; background:var(--ink-black); border:2px solid var(--line); color:var(--paper);
    border-radius:3px; padding:9px 10px; font-family:'Rubik',sans-serif; font-size:13px;
    resize:vertical; color-scheme:dark;
  }
  .field input[type="text"]:focus, .field input[type="date"]:focus, .field textarea:focus{ outline:none; border-color:var(--yellow); }

  .filedrop{
    border:2px dashed var(--line); border-radius:4px; padding:16px; text-align:center;
    color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:border-color .15s;
  }
  .filedrop:hover{ border-color:var(--yellow); }
  .filedrop input{ display:none; }

  .preview-img{
    width:100%; border-radius:4px; margin-bottom:14px; display:block;
    border:2px solid #05060a;
  }

  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; border:2px solid #05060a; border-radius:4px; padding:11px 14px; font-family:'Rubik',sans-serif;
    font-weight:700; font-size:13px; cursor:pointer; transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn-primary{ background:var(--yellow); color:#181200; box-shadow:3px 3px 0 var(--blue); }
  .btn-primary:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--blue); }
  .btn-primary:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--blue); }
  .btn-ghost{ background:var(--panel); border-color:var(--blue); color:var(--blue); }
  .btn-ghost:hover{ background:var(--blue-soft); }
  .btn-danger{ background:var(--panel); border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:rgba(226,84,63,0.15); }

  .note-text{ font-size:13px; color:var(--muted); line-height:1.55; white-space:pre-wrap; margin-bottom:14px;}

  /* ---------- Categories ---------- */
  .legend{
    display:flex; gap:18px; flex-wrap:wrap; margin-top:14px;
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:var(--paper);
  }
  .legend-item{ display:flex; align-items:center; gap:7px; }
  .legend-dot{ width:13px; height:13px; border-radius:50%; border:1.5px solid #05060a; display:inline-block; }

  .cat-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--ink-black); border:2px solid var(--line); border-radius:20px;
    padding:6px 12px; font-family:'Rubik',sans-serif; font-size:12px; font-weight:600;
    color:var(--muted); cursor:pointer; transition:border-color .15s, color .15s;
  }
  .cat-chip .legend-dot{ width:8px; height:8px; }
  .cat-chip:hover{ border-color:var(--muted-2); }
  .cat-chip.active{ border-color:currentColor; color:var(--paper); background:var(--panel-2); }

  .cat-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; color:var(--muted); margin-bottom:10px;
  }

  .check-row{
    display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:13px; color:var(--paper); font-weight:600;
  }
  .check-row input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--yellow); }

  .repeat-fields{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin:-6px 0 14px; padding:12px; background:var(--ink-black); border:2px solid var(--line); border-radius:6px;
    font-size:13px; color:var(--muted);
  }
  .repeat-fields input[type="number"]{
    width:56px; background:var(--panel-2); border:2px solid var(--line); color:var(--paper);
    border-radius:3px; padding:6px 8px; font-family:'Rubik',sans-serif; font-size:13px; text-align:center;
  }
  .repeat-fields input[type="number"]:focus{ outline:none; border-color:var(--yellow); }

  .status{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); text-align:center; padding:30px 0; }

  .empty-hint{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
    padding:6px 0 0;
  }
</style>
</head>
<body>

  <div class="topbar">
  <div class="toolbar">
    <button class="lock-btn" id="lockBtn" title="Unlock editing">🔒 View only</button>
  </div>
    <div class="wrap" style="padding:0;">
      <h1>IGTG <span>EVENTS</span></h1>
      <div class="subtitle">by Roastbeast</div>
      <div class="stats" id="stats">loading archive…</div>
      <div class="search-wrap" id="searchWrap">
        <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search titles and notes…">
        <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="rail" id="rail"></div>

  <div class="wrap" id="calendar"></div>

  <button class="jump-today" id="jumpToday">TODAY ↓</button>

  <div class="overlay" id="overlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <div class="overlay" id="lockOverlay">
    <div class="modal" id="lockModal" style="max-width:320px;">
      <button class="modal-close" id="lockModalClose" aria-label="Close">&times;</button>
      <h2>Unlock editing</h2>
      <div class="date-sub">Enter the passcode to add or edit events</div>
      <div class="field">
        <input type="password" id="passcodeInput" placeholder="Passcode" autocomplete="off">
      </div>
      <div class="note-text" id="passcodeError" style="display:none; color:var(--danger);"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="passcodeCancel">Cancel</button>
        <button class="btn btn-primary" id="passcodeSubmit">Unlock</button>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  // Firebase config from your project settings — safe to be public in client-side code;
  // access control is handled by your Firestore security rules, not by hiding this.
  const firebaseConfig = {
    apiKey: "AIzaSyBF5PJm_3Wn79vz-w3QSt2Ub1aEBWJsAs4",
    authDomain: "igtg-event-calendar.firebaseapp.com",
    projectId: "igtg-event-calendar",
    storageBucket: "igtg-event-calendar.firebasestorage.app",
    messagingSenderId: "399368924816",
    appId: "1:399368924816:web:f57fdbbf1fbfafe2523215"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Drop-in replacement for Claude's window.storage API, backed by Firestore instead.
  // Every key/value pair lives as a document in a single "kv" collection, with the
  // document ID equal to the key and a mirrored "key" field so prefix listing works.
  window.storage = {
    async get(key, shared){
      const doc = await db.collection('kv').doc(key).get();
      if (!doc.exists) throw new Error('missing key: ' + key);
      return { key, value: doc.data().value, shared: true };
    },
    async set(key, value, shared){
      await db.collection('kv').doc(key).set({ key, value });
      return { key, value, shared: true };
    },
    async delete(key, shared){
      await db.collection('kv').doc(key).delete();
      return { key, deleted: true, shared: true };
    },
    async list(prefix, shared){
      let query = db.collection('kv');
      if (prefix){
        query = query.where('key', '>=', prefix).where('key', '<', prefix + '\uf8ff');
      }
      const snap = await query.get();
      return { keys: snap.docs.map(d => d.id) };
    }
  };
</script>
<script>
(function(){
  const MONTH_NAMES = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  const WEEKDAYS = ["S","M","T","W","T","F","S"];
  const CATEGORIES = [
    { key: 'events', label: 'Events', color: 'var(--cat-hero)' },
    { key: 'hero_release', label: 'Hero Release', color: 'var(--cat-nightmares)' },
    { key: 'hero_optimization', label: 'Hero Optimization', color: 'var(--yellow)' },
    { key: 'food_ops', label: 'Food Ops', color: 'var(--blue)' },
    { key: 'nightmares', label: 'Nightmares', color: 'var(--cat-food)' }
  ];
  const OTHER_CATEGORY = { key: '', label: 'Other', color: 'var(--yellow)' };
  function getCategory(key){
    return CATEGORIES.find(c => c.key === key) || OTHER_CATEGORY;
  }

  // Change this to whatever passcode you want to use to unlock editing.
  const OWNER_PASSCODE = "Dinorules";
  let isEditor = false;

  const lockBtn = document.getElementById('lockBtn');
  const lockOverlay = document.getElementById('lockOverlay');
  const lockModalClose = document.getElementById('lockModalClose');
  const passcodeInput = document.getElementById('passcodeInput');
  const passcodeError = document.getElementById('passcodeError');
  const passcodeCancel = document.getElementById('passcodeCancel');
  const passcodeSubmit = document.getElementById('passcodeSubmit');

  function setEditorMode(value){
    isEditor = value;
    lockBtn.textContent = isEditor ? '🔓 Editing' : '🔒 View only';
    lockBtn.classList.toggle('unlocked', isEditor);
    document.body.classList.toggle('editor-mode', isEditor);
  }

  function openPasscodeModal(){
    passcodeInput.value = '';
    passcodeError.style.display = 'none';
    lockOverlay.classList.add('open');
    setTimeout(()=> passcodeInput.focus(), 50);
  }
  function closePasscodeModal(){
    lockOverlay.classList.remove('open');
  }
  function submitPasscode(){
    if (passcodeInput.value === OWNER_PASSCODE){
      setEditorMode(true);
      closePasscodeModal();
    } else {
      passcodeError.textContent = 'That passcode isn\u2019t correct — try again.';
      passcodeError.style.display = 'block';
      passcodeInput.value = '';
      passcodeInput.focus();
    }
  }

  lockBtn.addEventListener('click', ()=>{
    if (isEditor){
      setEditorMode(false);
    } else {
      openPasscodeModal();
    }
  });
  lockModalClose.addEventListener('click', closePasscodeModal);
  passcodeCancel.addEventListener('click', closePasscodeModal);
  passcodeSubmit.addEventListener('click', submitPasscode);
  passcodeInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') submitPasscode(); });
  lockOverlay.addEventListener('click', (e)=>{ if (e.target === lockOverlay) closePasscodeModal(); });

  const today = new Date();
  today.setHours(0,0,0,0);
  const START_YEAR = 2024, START_MONTH = 0; // Jan 2024

  let eventDates = new Set(); // 'YYYY-MM-DD' strings known to have an entry
  let eventIndex = {}; // { 'YYYY-MM-DD': {title, note} } — lightweight, no images, used for search

  const calEl = document.getElementById('calendar');
  const railEl = document.getElementById('rail');
  const statsEl = document.getElementById('stats');
  const overlay = document.getElementById('overlay');
  const modalContent = document.getElementById('modalContent');
  const searchWrap = document.getElementById('searchWrap');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const searchResults = document.getElementById('searchResults');
  const legendEl = document.getElementById('legend');

  function renderLegend(){
    const items = [...CATEGORIES];
    legendEl.innerHTML = items.map(c => `
      <span class="legend-item"><span class="legend-dot" style="background:${c.color};"></span>${c.label}</span>
    `).join('');
  }

  function pad2(n){ return n.toString().padStart(2,'0'); }
  function dateKey(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
  function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function keyToDate(key){
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function enumerateDates(startKey, endKey){
    const out = [];
    let cur = keyToDate(startKey);
    const end = keyToDate(endKey);
    while (cur <= end){
      out.push(dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate()));
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }
  function addDaysToKey(key, days){
    const d = keyToDate(key);
    d.setDate(d.getDate() + days);
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function addWeeks(key, weeks){
    return addDaysToKey(key, weeks * 7);
  }

  // Accepts either the old single-event shape or the new array-of-events shape
  // stored under a day's key, and always returns an array of normalized events.
  // dayKey is used to backfill startDate/endDate on legacy single-day entries.
  function normalizeDayEvents(parsed, dayKey){
    if (Array.isArray(parsed)){
      return parsed.map(e => ({
        id: e.id || genId(),
        title: e.title || '',
        note: e.note || '',
        image: e.image || null,
        category: e.category || '',
        startDate: e.startDate || dayKey,
        endDate: e.endDate || e.startDate || dayKey
      }));
    }
    if (parsed && typeof parsed === 'object'){
      return [{
        id: genId(),
        title: parsed.title || '',
        note: parsed.note || '',
        image: parsed.image || null,
        category: parsed.category || '',
        startDate: parsed.startDate || dayKey,
        endDate: parsed.endDate || parsed.startDate || dayKey
      }];
    }
    return [];
  }

  function lightweight(events){
    return events.map(e => ({
      id: e.id, title: e.title, note: e.note, category: e.category,
      startDate: e.startDate, endDate: e.endDate,
      bytes: JSON.stringify(e).length
    }));
  }

  function buildWeeksForMonth(y, m){
    const firstDay = new Date(y, m, 1);
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const startWeekday = firstDay.getDay(); // 0=Sun, matches WEEKDAYS header order
    const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
    const weeks = [];
    let cur = new Date(y, m, 1 - startWeekday);
    for (let w=0; w<totalCells/7; w++){
      const week = [];
      for (let d=0; d<7; d++){
        week.push({
          key: dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate()),
          inMonth: cur.getMonth() === m,
          dayNum: cur.getDate()
        });
        cur.setDate(cur.getDate()+1);
      }
      weeks.push(week);
    }
    return weeks;
  }

  function computeWeekBars(week){
    const weekStart = week[0].key, weekEnd = week[6].key;
    const seen = new Map();
    week.forEach(cell => {
      (eventIndex[cell.key] || []).forEach(ev => { if (!seen.has(ev.id)) seen.set(ev.id, ev); });
    });
    const segments = [...seen.values()].map(ev=>{
      const segStart = ev.startDate > weekStart ? ev.startDate : weekStart;
      const segEnd = ev.endDate < weekEnd ? ev.endDate : weekEnd;
      const colStart = week.findIndex(c => c.key === segStart) + 1;
      const colEndIdx = week.findIndex(c => c.key === segEnd);
      return {
        ev, colStart, colSpan: colEndIdx - (colStart-1) + 1,
        isStart: segStart === ev.startDate,
        isEnd: segEnd === ev.endDate,
        clickKey: segStart
      };
    });
    segments.sort((a,b) => a.colStart - b.colStart || (a.ev.title||'').localeCompare(b.ev.title||''));
    const laneEnds = [];
    segments.forEach(seg=>{
      let lane = laneEnds.findIndex(endCol => endCol < seg.colStart);
      if (lane === -1){ lane = laneEnds.length; laneEnds.push(0); }
      laneEnds[lane] = seg.colStart + seg.colSpan - 1;
      seg.lane = lane;
    });
    return { segments, laneCount: Math.max(laneEnds.length, 1) };
  }

  function renderWeekHtml(week){
    const { segments, laneCount } = computeWeekBars(week);

    const daynumsHtml = week.map(cell=>{
      const cellDate = keyToDate(cell.key);
      const isToday = isSameDay(cellDate, today);
      const hasEvent = eventDates.has(cell.key);
      return `<button type="button" class="daynum-cell ${isToday?'today':''} ${!cell.inMonth?'outside':''} ${hasEvent?'has-event':''}"
        data-date="${cell.key}" aria-label="${cell.key}">${cell.dayNum}</button>`;
    }).join('');

    const barsHtml = segments.map(seg=>{
      const cat = getCategory(seg.ev.category || '');
      const cls = ['event-bar'];
      if (seg.isStart) cls.push('bar-start');
      if (seg.isEnd) cls.push('bar-end');
      const title = escapeHtml(seg.ev.title || 'Untitled event');
      return `<button type="button" class="${cls.join(' ')}" data-date="${seg.clickKey}"
        style="grid-column:${seg.colStart} / span ${seg.colSpan}; grid-row:${seg.lane+1}; background:${cat.color};"
        title="${title}">${title}</button>`;
    }).join('');

    return `
      <div class="week-row">
        <div class="week-daynums">${daynumsHtml}</div>
        <div class="week-bars" style="grid-template-rows:repeat(${laneCount}, 26px);">${barsHtml}</div>
      </div>
    `;
  }

  let currentMonths = [];

  function buildMonthsList(endY, endM){
    const targetY = endY !== undefined ? endY : today.getFullYear();
    const targetM = endM !== undefined ? endM : today.getMonth();
    const months = [];
    let y = START_YEAR, m = START_MONTH;
    while (y < targetY || (y === targetY && m <= targetM)){
      months.push({y, m});
      m++;
      if (m > 11){ m = 0; y++; }
    }
    return months;
  }

  function ensureMonthsCover(targetY, targetM){
    const last = currentMonths[currentMonths.length - 1];
    if (last && (targetY < last.y || (targetY === last.y && targetM <= last.m))) return false;
    currentMonths = buildMonthsList(targetY, targetM);
    renderRail(currentMonths);
    renderCalendar(currentMonths);
    return true;
  }

  function renderRail(months){
    const years = [...new Set(months.map(mo=>mo.y))];
    railEl.innerHTML = years.map(y => `<button data-year="${y}">${y}</button>`).join('');
    railEl.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const el = document.getElementById(`month-${btn.dataset.year}-${0}`) || document.querySelector(`[data-year-anchor="${btn.dataset.year}"]`);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function renderCalendar(months){
    let html = '';
    let lastYear = null;
    months.forEach(({y,m})=>{
      const anchorAttr = (y !== lastYear) ? `data-year-anchor="${y}"` : '';
      lastYear = y;

      const weeksHtml = buildWeeksForMonth(y, m).map(renderWeekHtml).join('');

      html += `
      <section class="reel" id="month-${y}-${m}" ${anchorAttr}>
        <div class="reel-label">
          <span class="reel-month">${MONTH_NAMES[m]}</span>
          <span class="reel-year">${y}</span>
          <span class="reel-count" data-count-for="${y}-${m}"></span>
        </div>
        <div class="weekdays">${WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="month-grid">${weeksHtml}</div>
      </section>`;
    });
    calEl.innerHTML = html;

    calEl.querySelectorAll('.daynum-cell, .event-bar').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.date;
        if (!isEditor && !eventDates.has(key)) return; // viewers can't create new entries
        openDay(key);
      });
    });

    updateMonthCounts(months);
  }

  function updateMonthCounts(months){
    months.forEach(({y,m})=>{
      const count = [...eventDates].filter(k=>{
        const [ky,km] = k.split('-').map(Number);
        return ky===y && (km-1)===m;
      }).reduce((sum,k) => sum + (eventIndex[k]||[]).length, 0);
      const el = document.querySelector(`[data-count-for="${y}-${m}"]`);
      if (el) el.textContent = count>0 ? `${count} event${count===1?'':'s'}` : '';
    });
  }

  function updateStats(){
    const total = Object.values(eventIndex).reduce((sum, arr) => sum + arr.length, 0);
    statsEl.innerHTML = total>0
      ? `Since Jan 2024 · <b>${total}</b> event${total===1?'':'s'} logged`
      : `Since Jan 2024 · click any day below to log your first event`;
  }

  async function loadEventIndex(){
    try{
      const res = await window.storage.list('event:', true);
      const keys = (res && res.keys) ? res.keys : [];
      eventDates = new Set(keys.map(k => k.startsWith('event:') ? k.slice(6) : k));
    }catch(err){
      console.error('Could not load event index', err);
      eventDates = new Set();
    }

    try{
      const idxRes = await window.storage.get('search-index', true);
      eventIndex = (idxRes && idxRes.value) ? JSON.parse(idxRes.value) : {};
    }catch(err){
      eventIndex = {};
    }

    // Migrate: any day missing from the index, stored in the old single-event shape,
    // missing a recorded size, or missing a date range (all older data formats)
    const needsMigration = [...eventDates].filter(k =>
      !(k in eventIndex) || !Array.isArray(eventIndex[k]) ||
      eventIndex[k].some(e => typeof e.bytes !== 'number' || !e.startDate || !e.endDate)
    );
    if (needsMigration.length){
      for (const k of needsMigration){
        try{
          const res = await window.storage.get('event:'+k, true);
          if (res && res.value){
            const parsed = JSON.parse(res.value);
            const normalized = normalizeDayEvents(parsed, k);
            // Write back in the new array format so future loads don't need to re-migrate
            await window.storage.set('event:'+k, JSON.stringify(normalized), true);
            eventIndex[k] = lightweight(normalized);
          }
        }catch(err){ /* skip this one, non-fatal */ }
      }
      persistIndex();
    }
  }

  async function persistIndex(){
    try{
      await window.storage.set('search-index', JSON.stringify(eventIndex), true);
    }catch(err){
      console.error('Could not save search index', err);
    }
  }

  function resizeImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image decode failed'));
        img.onload = () => {
          const maxDim = 720;
          let {width, height} = img;
          if (width > height && width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; }
          else if (height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg', 0.62));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function closeModal(){ overlay.classList.remove('open'); modalContent.innerHTML=''; }
  overlay.addEventListener('click', (e)=>{ if (e.target === overlay) closeModal(); });

  function formatPretty(key){
    const [y,m,d] = key.split('-').map(Number);
    return `${MONTH_NAMES[m-1]} ${d}, ${y}`;
  }

  async function openDay(key){
    modalContent.innerHTML = `<div class="status">loading…</div>`;
    overlay.classList.add('open');

    let dayEvents = [];
    if (eventDates.has(key)){
      try{
        const res = await window.storage.get('event:'+key, true);
        if (res && res.value) dayEvents = normalizeDayEvents(JSON.parse(res.value), key);
      }catch(err){
        console.error('Could not load events for this day', err);
      }
    }
    renderModal(key, dayEvents);
  }

  // Writes eventObj (with its own startDate/endDate) across every day it spans,
  // removing it from any days in oldStartKey..oldEndKey that are no longer in range
  // (used when editing shrinks/moves a date range). Preserves other events already
  // present on shared days.
  async function writeEventAcrossRange(eventObj, oldStartKey, oldEndKey, deferPersist, deferRender){
    const newDates = enumerateDates(eventObj.startDate, eventObj.endDate);
    const oldDates = oldStartKey ? enumerateDates(oldStartKey, oldEndKey) : [];
    const touched = new Set([...oldDates, ...newDates]);
    const newDateSet = new Set(newDates);

    for (const dk of touched){
      let current = [];
      if (eventDates.has(dk)){
        try{
          const res = await window.storage.get('event:'+dk, true);
          if (res && res.value) current = normalizeDayEvents(JSON.parse(res.value), dk);
        }catch(err){ console.error('Could not read day during range update', dk, err); }
      }
      current = current.filter(e => e.id !== eventObj.id);
      if (newDateSet.has(dk)) current.push(eventObj);

      if (current.length){
        await window.storage.set('event:'+dk, JSON.stringify(current), true);
        eventDates.add(dk);
        eventIndex[dk] = lightweight(current);
      } else {
        await window.storage.delete('event:'+dk, true);
        eventDates.delete(dk);
        delete eventIndex[dk];
      }
    }
    if (!deferRender) renderCalendar(currentMonths);
    if (!deferPersist) await persistIndex();
  }

  // Removes an event (identified by id) from every day in its stored range.
  async function removeEventAcrossRange(eventObj, deferPersist){
    const dates = enumerateDates(eventObj.startDate || eventObj.id, eventObj.endDate || eventObj.startDate);
    for (const dk of dates){
      let current = [];
      if (eventDates.has(dk)){
        try{
          const res = await window.storage.get('event:'+dk, true);
          if (res && res.value) current = normalizeDayEvents(JSON.parse(res.value), dk);
        }catch(err){ console.error('Could not read day during range delete', dk, err); }
      }
      const filtered = current.filter(e => e.id !== eventObj.id);
      if (filtered.length){
        await window.storage.set('event:'+dk, JSON.stringify(filtered), true);
        eventIndex[dk] = lightweight(filtered);
      } else {
        await window.storage.delete('event:'+dk, true);
        eventDates.delete(dk);
        delete eventIndex[dk];
      }
    }
    renderCalendar(currentMonths);
    if (!deferPersist) await persistIndex();
  }

  function renderModal(key, dayEvents){
    const pretty = formatPretty(key);

    const cardsHtml = dayEvents.map(ev => {
      const cat = getCategory(ev.category || '');
      const isMultiDay = ev.startDate && ev.endDate && ev.startDate !== ev.endDate;
      return `
        <div class="event-card" data-id="${ev.id}">
          <div class="cat-badge"><span class="legend-dot" style="background:${cat.color};"></span>${cat.label}</div>
          <h3>${escapeHtml(ev.title || 'Untitled event')}</h3>
          ${isMultiDay ? `<div class="date-sub" style="margin-bottom:8px;">${formatPretty(ev.startDate)} – ${formatPretty(ev.endDate)}</div>` : ''}
          ${ev.image ? `<img class="preview-img" src="${ev.image}" alt="">` : ''}
          ${ev.note ? `<div class="note-text">${escapeHtml(ev.note)}</div>` : ''}
          ${isEditor ? `
          <div class="event-card-actions">
            <button class="btn btn-ghost" data-action="edit" data-id="${ev.id}">Edit</button>
            <button class="btn btn-ghost" data-action="duplicate" data-id="${ev.id}">Duplicate</button>
            <button class="btn btn-danger" data-action="delete" data-id="${ev.id}">Delete</button>
          </div>
          <div class="note-text delete-error" data-error-for="${ev.id}" style="display:none; color:var(--danger); margin-top:8px; margin-bottom:0;"></div>` : ''}
        </div>
      `;
    }).join('');

    modalContent.innerHTML = `
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2>${pretty}</h2>
      <div id="eventList">
        ${cardsHtml || `<div class="note-text">No events yet.</div>`}
      </div>
      ${isEditor ? `<button class="btn btn-primary add-event-btn" id="addEventBtn">+ Add event</button>` : ''}
    `;
    modalContent.querySelector('.modal-close').addEventListener('click', closeModal);

    if (isEditor){
      modalContent.querySelector('#addEventBtn').addEventListener('click', ()=> renderForm(key, null, dayEvents));

      modalContent.querySelectorAll('[data-action="edit"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const ev = dayEvents.find(e => e.id === btn.dataset.id);
          if (ev) renderForm(key, ev, dayEvents);
        });
      });

      modalContent.querySelectorAll('[data-action="duplicate"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const ev = dayEvents.find(e => e.id === btn.dataset.id);
          if (ev) renderForm(key, null, dayEvents, ev);
        });
      });

      modalContent.querySelectorAll('[data-action="delete"]').forEach(btn=>{
        let armed = false;
        btn.addEventListener('click', async ()=>{
          if (!armed){
            armed = true;
            btn.textContent = 'Confirm?';
            setTimeout(()=>{ if (btn.isConnected){ armed = false; btn.textContent = 'Delete'; } }, 3000);
            return;
          }
          btn.disabled = true;
          btn.textContent = 'Deleting…';
          const id = btn.dataset.id;
          const ev = dayEvents.find(e => e.id === id);
          try{
            if (ev) await removeEventAcrossRange(ev);
            updateStats();
            runSearch();
            const refreshed = (eventIndex[key] || []);
            let fullRefreshed = [];
            if (eventDates.has(key)){
              const res = await window.storage.get('event:'+key, true);
              if (res && res.value) fullRefreshed = normalizeDayEvents(JSON.parse(res.value), key);
            }
            renderModal(key, fullRefreshed);
          }catch(err){
            console.error('Delete failed', err);
            btn.disabled = false;
            btn.textContent = 'Delete';
            armed = false;
            const errEl = modalContent.querySelector(`[data-error-for="${id}"]`);
            if (errEl){ errEl.textContent = 'Could not delete this event. Please try again.'; errEl.style.display = 'block'; }
          }
        });
      });
    }

    if (!isEditor && !dayEvents.length){
      modalContent.innerHTML = `
        <button class="modal-close" aria-label="Close">&times;</button>
        <h2>${pretty}</h2>
        <div class="note-text">This event isn't here anymore.</div>
      `;
      modalContent.querySelector('.modal-close').addEventListener('click', closeModal);
    }
  }

  function renderForm(key, existing, dayEventsSnapshot, duplicateFrom){
    const source = existing || duplicateFrom || null;
    const pretty = formatPretty(key);
    const startDefault = existing ? (existing.startDate || key) : key;
    const endDefault = existing ? (existing.endDate || existing.startDate || key) : key;
    modalContent.innerHTML = `

      <div class="field">
        <label for="titleInput">Title</label>
        <input type="text" id="titleInput" placeholder="e.g. Tech Jacket Hero Release" value="${source ? escapeHtml(source.title||'') : ''}">

          <input type="date" id="startDateInput" value="${startDefault}">
        </div>

          <input type="date" id="endDateInput" value="${endDefault}">
        </div>
      </div>
      ${!existing ? `

        <input type="checkbox" id="repeatCheck">
        Repeats
      </label>
      <div class="repeat-fields" id="repeatFields" style="display:none;">
        Every <input type="number" id="repeatWeeks" value="4" min="1" max="52"> week(s),
        for <input type="number" id="repeatCount" value="4" min="2" max="26"> occurrences
      </div>` : ''}
      <div class="field">
        <label>Category</label>
        <div class="cat-picker" id="catPicker">
          ${CATEGORIES.map(c => `
            <button type="button" class="cat-chip" data-cat="${c.key}" style="color:${c.color};">
              <span class="legend-dot" style="background:${c.color};"></span>${c.label}
            </button>
          `).join('')}
        </div>
      </div>
      <div class="field">
        <label for="noteInput">Note (optional)</label>
        <textarea id="noteInput" rows="2" placeholder="Anything you want to remember">${source ? escapeHtml(source.note||'') : ''}</textarea>
      </div>
      <div class="field">
        <label>Photo</label>
        ${source && source.image ? `<img class="preview-img" id="livePreview" src="${source.image}">` : `<img class="preview-img" id="livePreview" style="display:none;">`}
        <div class="filedrop" id="dropZone">
          <input type="file" id="fileInput" accept="image/*">
          <span id="dropLabel">Click to choose a photo</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
      <div class="note-text" id="formError" style="display:none; color:var(--danger); margin-top:10px;"></div>
    `;
    modalContent.querySelector('.modal-close').addEventListener('click', closeModal);
    modalContent.querySelector('#cancelBtn').addEventListener('click', ()=> renderModal(key, dayEventsSnapshot));

    const repeatCheck = modalContent.querySelector('#repeatCheck');
    const repeatFields = modalContent.querySelector('#repeatFields');
    if (repeatCheck){
      repeatCheck.addEventListener('change', ()=>{
        repeatFields.style.display = repeatCheck.checked ? 'flex' : 'none';
      });
    }

    let pendingImage = source ? source.image : null;
    let selectedCategory = source ? (source.category || '') : '';
    const dropZone = modalContent.querySelector('#dropZone');
    const fileInput = modalContent.querySelector('#fileInput');
    const livePreview = modalContent.querySelector('#livePreview');
    const dropLabel = modalContent.querySelector('#dropLabel');
    const catPicker = modalContent.querySelector('#catPicker');

    function refreshCatChips(){
      catPicker.querySelectorAll('.cat-chip').forEach(chip=>{
        chip.classList.toggle('active', chip.dataset.cat === selectedCategory);
      });
    }
    catPicker.querySelectorAll('.cat-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        selectedCategory = chip.dataset.cat;
        refreshCatChips();
      });
    });
    refreshCatChips();

    dropZone.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if (!file) return;
      dropLabel.textContent = 'Processing…';
      try{
        pendingImage = await resizeImage(file);
        livePreview.src = pendingImage;
        livePreview.style.display = 'block';
        dropLabel.textContent = file.name;
      }catch(err){
        console.error('Image processing failed', err);
        dropLabel.textContent = 'Could not read that image — try another.';
      }
    });

    modalContent.querySelector('#saveBtn').addEventListener('click', async ()=>{
      const title = modalContent.querySelector('#titleInput').value.trim();
      const note = modalContent.querySelector('#noteInput').value.trim();
      const startVal = modalContent.querySelector('#startDateInput').value;
      const endVal = modalContent.querySelector('#endDateInput').value;
      const formError = modalContent.querySelector('#formError');
      formError.style.display = 'none';

      if (!title && !pendingImage){
        formError.textContent = 'Add a title or a photo before saving.';
        formError.style.display = 'block';
        return;
      }
      if (!startVal || !endVal){
        formError.textContent = 'Pick a start and end date.';
        formError.style.display = 'block';
        return;
      }
      if (endVal < startVal){
        formError.textContent = 'The end date can\u2019t be before the start date.';
        formError.style.display = 'block';
        return;
      }
      if (enumerateDates(startVal, endVal).length > 90){
        formError.textContent = 'That range is over 90 days \u2014 double-check the dates before saving.';
        formError.style.display = 'block';
        return;
      }

      const isRepeating = repeatCheck && repeatCheck.checked;
      let repeatWeeksVal = 0, repeatCountVal = 0;
      if (isRepeating){
        repeatWeeksVal = parseInt(modalContent.querySelector('#repeatWeeks').value, 10) || 0;
        repeatCountVal = parseInt(modalContent.querySelector('#repeatCount').value, 10) || 0;
        if (repeatWeeksVal < 1 || repeatCountVal < 2){
          formError.textContent = 'Enter a valid repeat interval and occurrence count.';
          formError.style.display = 'block';
          return;
        }
        if (repeatCountVal > 26){
          formError.textContent = 'Please keep repeats to 26 occurrences or fewer at a time.';
          formError.style.display = 'block';
          return;
        }
      }

      const seriesId = isRepeating ? genId() : null;
      const eventObj = {
        id: existing ? existing.id : genId(),
        title: title || 'Untitled event',
        note, image: pendingImage, category: selectedCategory,
        startDate: startVal, endDate: endVal,
        seriesId: existing ? (existing.seriesId || null) : seriesId
      };

      const saveBtn = modalContent.querySelector('#saveBtn');
      saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;
      try{
        const oldStart = existing ? (existing.startDate || key) : null;
        const oldEnd = existing ? (existing.endDate || existing.startDate || key) : null;

        if (isRepeating){
          const spanDays = enumerateDates(startVal, endVal).length - 1;
          const lastOccStart = addWeeks(startVal, (repeatCountVal - 1) * repeatWeeksVal);
          const lastOccEnd = addDaysToKey(lastOccStart, spanDays);
          const [lastY, lastM] = lastOccEnd.split('-').map(Number);
          ensureMonthsCover(lastY, lastM - 1);

          for (let i = 0; i < repeatCountVal; i++){
            const occStart = addWeeks(startVal, i * repeatWeeksVal);
            const occEnd = addDaysToKey(occStart, spanDays);
            const occObj = { ...eventObj, id: i===0 ? eventObj.id : genId(), startDate: occStart, endDate: occEnd };
            await writeEventAcrossRange(occObj, null, null, true, true);
          }
          renderCalendar(currentMonths);
          await persistIndex();
        } else {
          await writeEventAcrossRange(eventObj, oldStart, oldEnd);
        }
        updateStats();
        runSearch();

        // Show the list for whichever day the user is still viewing, if the event still touches it;
        // otherwise fall back to the event's start date.
        const landingKey = enumerateDates(eventObj.startDate, eventObj.endDate).includes(key) ? key : eventObj.startDate;
        let landingEvents = [];
        if (eventDates.has(landingKey)){
          const res = await window.storage.get('event:'+landingKey, true);
          if (res && res.value) landingEvents = normalizeDayEvents(JSON.parse(res.value), landingKey);
        }
        renderModal(landingKey, landingEvents);
      }catch(err){
        console.error('Save failed', err);
        formError.textContent = 'Could not save this event — the photo may be too large. Try a smaller image.';
        formError.style.display = 'block';
        saveBtn.textContent = 'Save'; saveBtn.disabled = false;
      }
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }


  function runSearch(){
    const query = searchInput.value.trim().toLowerCase();
    searchWrap.classList.toggle('has-query', query.length > 0);

    // Reset highlighting when search is cleared
    if (!query){
      document.querySelectorAll('.daynum-cell.match, .daynum-cell.dimmed').forEach(el=>{
        el.classList.remove('match','dimmed');
      });
      searchResults.innerHTML = '';
      return;
    }

    const matches = [];
    Object.entries(eventIndex).forEach(([k, arr])=>{
      (arr || []).forEach(ev=>{
        if ((ev.title||'').toLowerCase().includes(query) || (ev.note||'').toLowerCase().includes(query)){
          matches.push({ key: k, ev });
        }
      });
    });

    // Highlight every day any matching event touches, even though the results
    // list below collapses each event down to a single row.
    const matchSet = new Set(matches.map(m => m.key));
    document.querySelectorAll('.daynum-cell').forEach(el=>{
      const isMatch = matchSet.has(el.dataset.date);
      el.classList.toggle('match', isMatch);
      el.classList.toggle('dimmed', !isMatch);
    });

    // Collapse to one result per unique event id (a multi-day event is stored
    // once per day it spans, so without this it'd show up once per day here).
    const uniqueById = new Map();
    matches.forEach(m => { if (!uniqueById.has(m.ev.id)) uniqueById.set(m.ev.id, m.ev); });
    const uniqueEvents = [...uniqueById.values()].sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));

    if (!uniqueEvents.length){
      searchResults.innerHTML = `<div class="search-empty">No events match "${escapeHtml(searchInput.value.trim())}"</div>`;
      return;
    }

    searchResults.innerHTML = uniqueEvents.map(ev=>{
      const start = ev.startDate, end = ev.endDate || ev.startDate;
      const dateLabel = (end && end !== start) ? `${formatPretty(start)} – ${formatPretty(end)}` : formatPretty(start);
      return `
        <div class="search-result" data-date="${start}">
          <span class="sr-title">${escapeHtml(ev.title || 'Untitled event')}</span>
          <span class="sr-date">${dateLabel}</span>
        </div>
      `;
    }).join('');

    searchResults.querySelectorAll('.search-result').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.dataset.date;
        const cell = document.querySelector(`.daynum-cell[data-date="${key}"]`);
        if (cell) cell.scrollIntoView({behavior:'smooth', block:'center'});
        openDay(key);
      });
    });
  }

  searchInput.addEventListener('input', runSearch);
  searchClear.addEventListener('click', ()=>{
    searchInput.value = '';
    runSearch();
    searchInput.focus();
  });
  document.getElementById('jumpToday').addEventListener('click', ()=>{
    const el = document.getElementById(`month-${today.getFullYear()}-${today.getMonth()}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });

  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape'){ closeModal(); closePasscodeModal(); } });

  (async function init(){
    renderLegend();
    currentMonths = buildMonthsList();
    await loadEventIndex();
    renderRail(currentMonths);
    renderCalendar(currentMonths);
    updateStats();

    const todayMonthEl = document.getElementById(`month-${today.getFullYear()}-${today.getMonth()}`);
    if (todayMonthEl) todayMonthEl.scrollIntoView({behavior:'instant', block:'start'});
  })();
})();
</script>
